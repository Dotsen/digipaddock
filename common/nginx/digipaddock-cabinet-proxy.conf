# DigiPaddock: the cabinet's API behind nginx. X-Forwarded-For is SET to the peer, never appended to:
# the cabinet rate-limits sign-ins by its first address.
proxy_pass http://unix:/run/digipaddock-cabinet-http/http.sock;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 90s;
