# DigiPaddock: the request limit of the web board (the cabinet) and a WebSocket upgrade only on the client's request
# 30r/s: opening a card is ~15 requests, live screens reread on events; at 10r/s the owner got 503
limit_req_zone $binary_remote_addr zone=kd_board:1m rate=30r/s;
# Limit sign-in by code, password, or passkey to five attempts per IP per minute.
# The cabinet also tracks sign-in attempts itself.
limit_req_zone $binary_remote_addr zone=kd_auth:1m rate=5r/m;
map $http_upgrade $kd_board_connection_upgrade {
    default upgrade;
    ''      close;
}
