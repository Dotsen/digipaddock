# DigiPaddock: the board's site — the owner's cabinet. HTTP: ACME and a redirect.
server {
    listen 80;
    server_name @host:cabinet_host@;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/@host:cabinet_host@;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / { return 301 https://@host:cabinet_host@$request_uri; }
}

# --- https ---
server {
    listen 443 ssl http2;
    server_name @host:cabinet_host@;

    ssl_certificate /etc/letsencrypt/live/@host:cabinet_host@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@host:cabinet_host@/privkey.pem;

    # Rotate cabinet logs with /etc/logrotate.d/digipaddock-board-nginx.
    # The host reader has a default ACL here so agents can read logs through kd-host-read.
    access_log /var/log/nginx/board/access.log;
    error_log /var/log/nginx/board/error.log;

    # the cabinet lets people in itself (a code, a passkey, a password + TOTP); there is no basic auth here
    include /etc/nginx/digipaddock-cabinet-headers.conf;
    limit_req zone=kd_board burst=100 nodelay;
    client_max_body_size 11m;

    # the cabinet's frontend (built by cabinet_setup.sh); the application's routes are its index.html
    root /var/lib/digipaddock/cabinet-web/dist;
    location = /index.html { include /etc/nginx/digipaddock-cabinet-headers.conf; add_header Cache-Control "no-store" always; }
    location = /sw.js {
        include /etc/nginx/digipaddock-cabinet-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Service-Worker-Allowed "/" always;
    }
    # the standard mime.types has no .webmanifest — without this the manifest goes out as application/octet-stream
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }
    location /assets/ {
        include /etc/nginx/digipaddock-cabinet-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    # The frame a diagram of a card's text is drawn in has headers of its own instead
    # of the cabinet's: mermaid draws with inline styles. The cabinet embeds it sandboxed, and the policy sandboxes
    # it for whoever opens the address itself: an opaque origin, no session. It runs the scripts of /assets/ and
    # loads nothing else
    location = /diagram.html {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src https://@host:cabinet_host@/assets/; style-src 'unsafe-inline'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'; sandbox allow-scripts" always;
    }
    location / { try_files $uri /index.html; }

    # the API and the live channel — the kd-cabinet service on the socket digipaddock-cabinet-http.socket
    # the strict zone guards the three sign-in POSTs alone: cancelling a passkey prompt or signing out is not an attempt
    location = /api/auth/code { limit_req zone=kd_auth burst=5 nodelay; include /etc/nginx/digipaddock-cabinet-proxy.conf; }
    location = /api/auth/password { limit_req zone=kd_auth burst=5 nodelay; include /etc/nginx/digipaddock-cabinet-proxy.conf; }
    location = /api/auth/passkey { limit_req zone=kd_auth burst=5 nodelay; include /etc/nginx/digipaddock-cabinet-proxy.conf; }
    location /api/ { include /etc/nginx/digipaddock-cabinet-proxy.conf; }
    # A message's text and files in one request — 100 MB of files and the multipart framing; the cabinet
    # itself holds a file to 20 MB and the message to 100 MB (413)
    location ~ "^/api/(cards|agents)/[^/]+/files$" { client_max_body_size 101m; include /etc/nginx/digipaddock-cabinet-proxy.conf; }
    location = /ws {
        proxy_pass http://unix:/run/digipaddock-cabinet-http/http.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kd_board_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
    }

    # old links — in card comments, the Telegram bot's lines and MERGED/RELEASED notices; the card comes with the host's
    # former prefix, the card's page leads to the present one
    location ~ "^/board/([A-Z][A-Z0-9]{1,5}-[0-9]+)$" { return 301 /cards/$1; }
    location ~ "^/admin/approvals/([A-Z][A-Z0-9]{1,5}-[0-9]+)" { return 301 /cards/$1; }
    location ~ "^/boss/promotions/([0-9a-f]{32})$" { return 301 /decisions/by-proposal/$1; }

    # the monitor's static pages are gone — servers and P-n are in the cabinet (/servers, /incidents/P-n); the old
    # addresses answer 404 explicitly (otherwise the application's index.html would serve them with 200)
    location = /monitor { return 404; }
    location ^~ /monitor/ { return 404; }
}
# --- /https ---
