<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <title>Diagram</title>
    <style>
      /* the frame is as tall as its drawing; one taller than the page allows scrolls here */
      html, body { margin: 0; background: transparent; overflow-x: hidden; }
      #out { overflow-x: auto; }
      #out svg { display: block; height: auto; }
    </style>
  </head>
  <body>
    <div id="out"></div>
    <script src="%MERMAID%"></script>
    <script src="%FRAME%"></script>
  </body>
</html>
