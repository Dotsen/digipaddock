# Known vulnerabilities taken out of the vulns step of dev.check and the daily scan (docs/testing.md,
# "Known vulnerabilities"): each entry with a reason and a date at most 90 days ahead; past the date it blocks again.

# CVE-2026-118773: glob keeps walking after its AbortSignal fired (fixed only in glob 14.0.2). The cabinet's
# glob 11.1.0 comes from workbox-build (dev dependency, the service worker build), which calls globSync over the
# build output with no signal option, so the abort path is never taken; no glob 14 fits workbox-build's range.
[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-02-21
reason = "glob 11.1.0 only via workbox-build at build time: globSync without an AbortSignal never reaches the abort path"

# CVE-2026-118764: minimatch amplifies globParts for an attacker-supplied pattern with "**/../" under
# optimizationLevel >= 2 (fixed only in minimatch 11.0.1, no 10.x backport). The cabinet's minimatch 10.2.6 is
# nested under that same glob 11.1.0 (range ^10.1.1); its only patterns are the static globPatterns and
# globIgnores of vite.config.ts at build time, with no "**/../" and nothing from outside.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-22
reason = "minimatch 10.2.6 only via glob 11.1.0 of workbox-build at build time: patterns are the static ones of vite.config.ts, no **/../"
