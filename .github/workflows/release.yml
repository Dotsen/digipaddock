# A release tag v...: the tree and the built cabinet web as one archive, its checksum and a keyless
# Sigstore signature, published as a draft release the owner reviews and publishes. The tag itself is signed with the
# owner's SSH key and kd-release verifies that one (host/allowed_signers); this signature is for whoever downloads the
# archive: cosign verify-blob --certificate <archive>.pem --signature <archive>.sig with this workflow's identity.
# The web is built in a job of its own: npm's dependencies run where no token can sign or publish.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Cabinet web
        working-directory: common/cabinet/web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cabinet-web
          path: common/cabinet/web/dist
          if-no-files-found: error
          retention-days: 1
  release:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: cabinet-web
          path: common/cabinet/web/dist
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb  # v3.8.2
        with:
          cosign-release: v2.5.0
      - name: Archive, checksum, signature
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ $TAG =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "unexpected tag $TAG" >&2; exit 1; }
          name="digipaddock-$TAG"
          git archive --format=tar --prefix="$name/" -o "$name.tar" "$GITHUB_SHA"
          tar -rf "$name.tar" --transform "s,^,$name/," common/cabinet/web/dist
          gzip -n "$name.tar"
          sha256sum "$name.tar.gz" > SHA256SUMS
          cosign sign-blob --yes --output-signature "$name.tar.gz.sig" --output-certificate "$name.tar.gz.pem" "$name.tar.gz"
      - name: Draft release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          name="digipaddock-$TAG"
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes "The tree with the built cabinet web; SHA256SUMS and a keyless Sigstore signature (.sig, .pem)." \
            "$name.tar.gz" "$name.tar.gz.sig" "$name.tar.gz.pem" SHA256SUMS
